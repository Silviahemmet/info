<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#062f71">
  <title>Silviahemmet – information</title>
  <style>
    :root { --blue:#062d6c; --blue2:#0a428f; --cream:#f7f7fa; --ink:#102852; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    body { margin:0; min-height:100vh; overflow:hidden; color:white; font-family:Arial, Helvetica, sans-serif; background:radial-gradient(circle at 13% 10%,#1556a6 0,transparent 27%), linear-gradient(135deg,#06377e,#031f50 70%); }
    main { width:100vw; max-width:100vw; height:100vh; max-height:100vh; overflow:hidden; padding:2.1vh 2vw; display:grid; grid-template-rows:12.5vh 49.5vh minmax(0,1fr); gap:1.5vh; }
    header { display:grid; grid-template-columns:32% 36% 32%; align-items:center; padding:0; }
    .brand { display:flex; flex-direction:column; align-items:flex-end; justify-self:end; }
    .brand img { display:block; width:18vw; min-width:210px; max-width:355px; height:auto; }
    .brand { flex-direction:row; align-items:center; justify-content:flex-end; color:#fff; white-space:nowrap; }
    .brand-mark { display:inline-block; position:relative; width:clamp(22px,2.2vw,42px); height:clamp(22px,2.2vw,42px); margin-right:clamp(5px,.45vw,9px); border:clamp(2px,.19vw,4px) solid #fff; }
    .brand-mark:before, .brand-mark:after { content:""; position:absolute; left:50%; top:50%; background:#fff; }
    .brand-mark:before { width:135%; height:20%; margin-left:-67.5%; margin-top:-10%; }
    .brand-mark:after { width:20%; height:135%; margin-left:-10%; margin-top:-67.5%; }
    .brand-heart { position:absolute; z-index:1; left:50%; top:50%; transform:translate(-50%,-53%); color:#062d6c; font-size:clamp(12px,1.15vw,22px); line-height:1; }
    .brand-word { display:inline-block; font-family:Arial,Helvetica,sans-serif; font-size:clamp(30px,3.1vw,60px); font-weight:800; letter-spacing:-.17vw; line-height:1; }
    .cross { grid-row:1 / span 2; align-self:center; position:relative; width:.65em; height:.65em; border:3px solid white; border-radius:1px; }
    .cross::before, .cross::after { content:""; position:absolute; background:white; left:50%; top:50%; transform:translate(-50%,-50%); }
    .cross::before { width:76%; height:22%; }
    .cross::after { width:22%; height:76%; }
    .clock { font-size:clamp(46px,5.4vw,104px); font-weight:700; letter-spacing:-4px; line-height:.8; padding-right:2vw; }
    .day-info { justify-self:center; padding:0; text-align:center; }
    .date { font-size:clamp(21px,2vw,38px); font-weight:600; opacity:.96; }
    .name-day { display:flex; justify-content:center; align-items:center; gap:10px; font-size:clamp(17px,1.55vw,29px); margin-top:10px; color:#f6f7ff; }
    .flower { color:#ffa3cc; font-size:1.25em; line-height:1; }
    #name { color:#ffa3cc; font-weight:700; }
    .top { display:grid; grid-template-columns:31% 32% minmax(0,1fr); gap:1.4vw; min-width:0; min-height:0; }
    .panel { border-radius:34px; overflow:hidden; }
    .weather { position:relative; padding:clamp(20px,2vw,38px); border:2px solid rgba(255,255,255,.9); background:linear-gradient(135deg,rgba(8,67,144,.72),rgba(3,36,91,.82)); display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; }
    .weather > :not(.weather-art):not(.current-rain) { position:relative; z-index:1; }
    .weather-art { display:none; position:absolute; z-index:0; width:140%; max-width:none; left:-20%; bottom:-15%; opacity:.55; pointer-events:none; -webkit-mask-image:radial-gradient(ellipse 67% 60% at 50% 62%,#000 38%,rgba(0,0,0,.8) 58%,transparent 82%); mask-image:radial-gradient(ellipse 67% 60% at 50% 62%,#000 38%,rgba(0,0,0,.8) 58%,transparent 82%); }
    .weather.has-illustration .weather-art, .weather.has-rain .weather-art { display:block; }
    .weather.has-illustration .weather-icon, .weather.has-rain .weather-icon { visibility:visible; }
    .current-rain { display:none; position:absolute; top:0; right:0; bottom:0; left:0; z-index:0; overflow:hidden; pointer-events:none; }
    .weather.has-rain .current-rain { display:block; }
    .current-rain .rain-drop { display:block; position:absolute; width:clamp(7px,.55vw,11px); height:clamp(17px,1.3vw,26px); background-image:url('weather-raindrop-sprite.png'); background-position:center; background-size:100% 100%; background-repeat:no-repeat; animation:current-rain-fall 5.5s linear infinite; -webkit-animation:current-rain-fall 5.5s linear infinite; }
    .current-rain .drop-one { left:45%; top:46%; animation-delay:0s; -webkit-animation-delay:0s; }
    .current-rain .drop-two { left:57%; top:51%; animation-delay:1.8s; -webkit-animation-delay:1.8s; }
    .current-rain .drop-three { left:68%; top:45%; animation-delay:3.6s; -webkit-animation-delay:3.6s; }
    .weather h1 { margin:0 0 8px; font-size:clamp(24px,2.15vw,42px); }
    .weather .condition { font-size:clamp(18px,1.5vw,28px); opacity:.92; }
    .reading { position:relative; display:flex; align-items:center; gap:clamp(10px,1vw,18px); }
    .temp { font-size:clamp(56px,5vw,96px); font-weight:700; line-height:.9; letter-spacing:-4px; white-space:nowrap; }
    .weather-icon { position:absolute; z-index:1; right:88%; top:50%; width:clamp(220px,15vw,300px); height:clamp(220px,15vw,300px); transform:translateY(-50%); filter:drop-shadow(0 5px 7px rgba(0,0,0,.16)); pointer-events:none; }
    .weather-icon svg { width:100%; height:100%; overflow:visible; }
    .weather-icon img { display:block; width:100%; height:100%; object-fit:contain; }
    .weather-icon .sun { stroke:#ffe38a; fill:none; stroke-width:5; stroke-linecap:round; }
    .weather-icon circle.sun { fill:#ffd54f; stroke:#ffe78a; filter:drop-shadow(0 0 9px rgba(255,214,62,.72)); }
    .weather-icon .cloud { fill:#f5f9ff; stroke:#d8e8ff; stroke-width:3; }
    .weather-icon .rain, .weather-icon .fog { stroke:#9fd8ff; stroke-width:5; stroke-linecap:round; }
    .weather-icon .snow { fill:#dff4ff; stroke:#dff4ff; stroke-width:3; stroke-linecap:round; }
    .weather-icon .bolt { fill:#ffe27a; stroke:#ffe27a; stroke-linejoin:round; }
    .details { grid-column:1/-1; display:flex; gap:clamp(9px,1vw,20px); padding-top:2vh; font-size:clamp(14px,1.1vw,21px); }
    .forecast { min-width:0; min-height:0; overflow:hidden; isolation:isolate; padding:clamp(7px,.7vw,13px) clamp(28px,3vw,58px); background:#f0f5fb; color:#143d7c; border:0; }
    .forecast h2 { position:relative; z-index:10; margin:0; background:transparent; font-size:clamp(19px,1.45vw,28px); text-transform:uppercase; text-align:center; letter-spacing:.02em; }
    .forecast h2 small { display:none; }
    #forecast-days { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0; min-width:0; margin-top:clamp(2px,.45vh,6px); }
    .forecast-day { text-align:center; min-width:0; padding:0 clamp(5px,.7vw,14px); border-left:1px solid #cbd8eb; }
    .forecast-day:first-child { border-left:0; }
    .forecast-day .weekday { display:block; position:relative; z-index:5; background:transparent; font-size:clamp(14px,1.05vw,20px); font-weight:800; text-transform:uppercase; }
    .forecast-day .mini-icon { display:block; position:relative; height:clamp(54px,4.8vw,92px); margin:4px 0 2px; line-height:1; overflow:hidden; }
    .forecast-day .mini-icon img { display:block; position:relative; z-index:2; width:190%; height:190%; left:-45%; top:-45%; max-width:none; object-fit:contain; }
    .forecast-day .high { display:block; position:relative; z-index:6; background:transparent; font-size:clamp(21px,1.55vw,30px); font-weight:800; line-height:1; }
    .forecast-day .low { display:block; position:relative; z-index:6; margin-top:2px; background:transparent; font-size:clamp(14px,1vw,19px); font-weight:600; opacity:.65; line-height:1; }
    .mini-icon.weather-cloud img, .mini-icon.weather-partly img { animation:forecast-float 15s ease-in-out infinite; -webkit-animation:forecast-float 15s ease-in-out infinite; }
    .mini-icon.weather-partly, .mini-icon.weather-cloud, .mini-icon.weather-rain { overflow:visible; }
    .mini-icon.weather-sun img { animation:forecast-spin 14s linear infinite; -webkit-animation:forecast-spin 14s linear infinite; }
    .mini-icon.weather-rain img { animation:forecast-float 15s ease-in-out infinite; -webkit-animation:forecast-float 15s ease-in-out infinite; }
    .mini-icon.weather-rain .rain-drop { display:block; position:absolute; z-index:4; top:57%; width:10px; height:25px; opacity:.5; background:url('weather-raindrop-sprite.png') center/100% 100% no-repeat; animation:forecast-rain 4.5s linear infinite; -webkit-animation:forecast-rain 4.5s linear infinite; }
    .mini-icon.weather-rain .drop-one { left:29%; animation-delay:0s; -webkit-animation-delay:0s; }
    .mini-icon.weather-rain .drop-two { left:47%; animation-delay:1.5s; -webkit-animation-delay:1.5s; }
    .mini-icon.weather-rain .drop-three { left:65%; animation-delay:3s; -webkit-animation-delay:3s; }
    @keyframes forecast-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7%); } }
    @-webkit-keyframes forecast-float { 0%,100% { -webkit-transform:translateY(0); } 50% { -webkit-transform:translateY(-7%); } }
    @keyframes forecast-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    @-webkit-keyframes forecast-spin { from { -webkit-transform:rotate(0deg); } to { -webkit-transform:rotate(360deg); } }
    @keyframes forecast-rain { 0% { opacity:0; transform:translateY(-55%); } 18% { opacity:.35; } 100% { opacity:0; transform:translateY(135%); } }
    @-webkit-keyframes forecast-rain { 0% { opacity:0; -webkit-transform:translateY(-55%); } 18% { opacity:.35; } 100% { opacity:0; -webkit-transform:translateY(135%); } }
    @keyframes current-rain-fall { 0% { opacity:0; transform:translateY(-70%); } 18% { opacity:.28; } 100% { opacity:0; transform:translateY(190%); } }
    @-webkit-keyframes current-rain-fall { 0% { opacity:0; -webkit-transform:translateY(-70%); } 18% { opacity:.28; } 100% { opacity:0; -webkit-transform:translateY(190%); } }
    .details span { display:block; opacity:.75; font-size:.72em; margin-bottom:2px; }
    .photo { position:relative; background:#edf1f8; }
    .photo img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; transition:filter 2s ease; }
    .photo-title { position:absolute; z-index:4; top:8%; left:50%; width:90%; transform:translateX(-50%) rotate(-10.8deg); transform-origin:center; color:#1d5597; font-family:"Brush Script MT","Segoe Script",cursive; font-size:clamp(29px,2.85vw,56px); font-weight:400; line-height:1; text-align:center; white-space:nowrap; text-shadow:none; letter-spacing:-1px; }
    .photo-heart { display:inline-block; margin-left:.35em; color:#f17fae; font-family:Arial,Helvetica,sans-serif; font-size:.72em; font-weight:400; vertical-align:.18em; }
    .photo-weather { position:absolute; z-index:3; inset:0; overflow:hidden; pointer-events:none; }
    .photo-weather::before, .photo-weather::after { content:""; position:absolute; inset:-25%; opacity:0; pointer-events:none; }
    .photo.weather-sunny .photo-weather { background:radial-gradient(circle at 78% 8%,rgba(255,232,125,.42),transparent 34%); }
    .photo.weather-sunny img { filter:brightness(1.06) saturate(1.08); }
    .photo.weather-partly .photo-weather::before, .photo.weather-overcast .photo-weather::before {
      opacity:.24;
      background:radial-gradient(ellipse at 18% 35%,rgba(30,55,85,.46) 0 13%,transparent 34%),radial-gradient(ellipse at 68% 62%,rgba(40,65,95,.4) 0 15%,transparent 36%);
      animation:photo-cloud-shadows 32s ease-in-out infinite;
      -webkit-animation:photo-cloud-shadows 32s ease-in-out infinite;
    }
    .photo.weather-overcast img, .photo.weather-rain img, .photo.weather-snow img, .photo.weather-thunder img { filter:brightness(.82) saturate(.82) contrast(1.04); }
    .photo.weather-rain .photo-weather::after, .photo.weather-thunder .photo-weather::after {
      opacity:.27;
      background-image:url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png'),url('weather-raindrop-sprite.png');
      background-repeat:no-repeat;
      background-size:12px 30px,16px 39px,11px 27px,14px 35px,10px 25px,15px 37px,12px 30px;
      background-position:9% 18%,24% 67%,39% 31%,54% 76%,68% 14%,82% 52%,94% 29%;
      animation:photo-rain 7.5s linear infinite;
      -webkit-animation:photo-rain 7.5s linear infinite;
    }
    .photo.weather-snow .photo-weather::after {
      opacity:.82;
      background-image:radial-gradient(circle,#fff 0 3px,transparent 4px),radial-gradient(circle,#e9f7ff 0 5px,transparent 6px);
      background-position:0 0,38px 52px;
      background-size:76px 76px,112px 112px;
      animation:photo-snow 12s linear infinite;
      -webkit-animation:photo-snow 12s linear infinite;
    }
    .photo.weather-fog .photo-weather::after {
      opacity:.58;
      background:repeating-linear-gradient(0deg,rgba(240,247,252,.72) 0 10%,rgba(235,243,249,.18) 18%,transparent 28%);
      filter:blur(10px);
      animation:photo-fog 24s ease-in-out infinite;
      -webkit-animation:photo-fog 24s ease-in-out infinite;
    }
    .photo.weather-thunder .photo-weather::before {
      opacity:0;
      background:#eaf5ff;
      animation:photo-lightning 9s linear infinite;
      -webkit-animation:photo-lightning 9s linear infinite;
    }
    @keyframes photo-cloud-shadows { 0%,100% { transform:translateX(-8%); } 50% { transform:translateX(12%); } }
    @-webkit-keyframes photo-cloud-shadows { 0%,100% { -webkit-transform:translateX(-8%); } 50% { -webkit-transform:translateX(12%); } }
    @keyframes photo-rain { from { transform:translateY(-14%); } to { transform:translateY(20%); } }
    @-webkit-keyframes photo-rain { from { -webkit-transform:translateY(-14%); } to { -webkit-transform:translateY(20%); } }
    @keyframes photo-snow { from { transform:translate(0,-12%); } to { transform:translate(5%,12%); } }
    @-webkit-keyframes photo-snow { from { -webkit-transform:translate(0,-12%); } to { -webkit-transform:translate(5%,12%); } }
    @keyframes photo-fog { 0%,100% { transform:translateX(-8%); } 50% { transform:translateX(8%); } }
    @-webkit-keyframes photo-fog { 0%,100% { -webkit-transform:translateX(-8%); } 50% { -webkit-transform:translateX(8%); } }
    @keyframes photo-lightning { 0%,8%,10%,12%,100% { opacity:0; } 9%,11% { opacity:.58; } }
    @-webkit-keyframes photo-lightning { 0%,8%,10%,12%,100% { opacity:0; } 9%,11% { opacity:.58; } }
    .news { background:linear-gradient(110deg,#f9fafc,#dde2ed); color:var(--ink); padding:clamp(20px,2.1vw,40px); display:grid; grid-template-columns:15% 1fr; gap:2.2vw; align-items:center; }
    .news-label { align-self:start; font-size:clamp(25px,2.8vw,52px); font-weight:800; color:#0754a2; letter-spacing:-2px; }
    .news-label small { display:block; color:#3d4c66; font-weight:500; font-size:.43em; letter-spacing:0; margin-top:7px; }
    #headlines { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5vw; }
    .headline { color:#000; font-size:clamp(18px,1.55vw,29px); line-height:1.18; font-weight:600; border-left:4px solid #1d69b5; padding-left:18px; }
    .headline a { color:inherit; text-decoration:none; }
    .top .news { display:block; padding:clamp(16px,1.7vw,32px) clamp(22px,2.3vw,44px); }
    .top .news-label { display:flex; align-items:baseline; justify-content:center; gap:clamp(14px,1.5vw,28px); text-align:center; font-size:clamp(25px,2.4vw,44px); }
    .top .news-label small { display:inline; margin:0; font-size:.5em; }
    .top #headlines { display:block; margin-top:clamp(16px,2.2vh,36px); }
    .top .headline { font-size:clamp(21px,1.75vw,33px); line-height:1.28; border-left-width:5px; padding-left:18px; }
    .top .headline.quote { border-left-color:#f08abb; font-style:italic; }

    .top .news.quote-slide #news-section { font-size:.42em; white-space:nowrap; }
    .top .news.quote-slide #headlines { margin-top:clamp(14px,2vh,28px); }
    .top .news.quote-slide .headline { font-size:clamp(19px,1.45vw,28px); line-height:1.22; }
    .top .news.quote-slide .quote-byline { margin-top:8px; }
    .forecast-wide { display:grid; grid-template-columns:1fr; grid-template-rows:auto 1fr; align-items:center; }
    .forecast-wide #forecast-days { margin-top:clamp(2px,.45vh,6px); }
    .top .forecast { display:grid; grid-template-rows:auto 1fr; align-items:center; height:100%; padding:clamp(12px,1.2vw,22px) clamp(10px,1vw,20px); }
    .top .forecast #forecast-days { align-items:center; }
    .top .forecast-day .mini-icon img { width:95%; height:95%; left:2.5%; top:0; }
    .top .forecast-day .mini-icon.weather-rain .rain-drop { width:6px; height:15px; opacity:.45; }
    main > .news { min-height:0; overflow:hidden; grid-template-columns:18% minmax(0,1fr); gap:2vw; padding:clamp(22px,2.2vw,42px); }
    main > .news .news-label { align-self:center; }
    main > .news #headlines { grid-template-columns:minmax(0,1fr); width:100%; align-items:center; }
    main > .news .headline { width:100%; font-size:clamp(25px,2.05vw,40px); line-height:1.16; }
    main > .news .headline, main > .news .headline a { white-space:normal; overflow-wrap:break-word; word-wrap:break-word; }
    main > .news .headline.long-headline { font-size:clamp(22px,1.72vw,33px); }
    main > .news .headline.very-long-headline { font-size:clamp(19px,1.5vw,29px); }

    main > .news.quote-slide .news-label { font-size:clamp(25px,2.35vw,45px); letter-spacing:-1px; }
    main > .news.quote-slide #news-source { white-space:nowrap; }
    main > .news.quote-slide #news-section { margin-top:8px; font-size:.42em; white-space:nowrap; }

    main > .news.nameday-slide .headline { border-left:0; padding-left:0; text-align:center; font-size:clamp(34px,3.2vw,62px); font-weight:700; }

    @media (max-aspect-ratio: 1/1) { main { grid-template-rows:10vh 51vh 1fr; } .top{grid-template-columns:1fr 1fr}.weather{padding:20px}.details{gap:10px}.news{grid-template-columns:1fr}.news-label{font-size:26px} }

    /* Finnsat's player uses an older browser.  This deliberately uses only
       long-established CSS so the 16:9 layout also works there. */

    html.legacy-player header { display:block; height:12.5vh; position:relative; }

    html.legacy-player .day-info { position:absolute; left:32%; top:14%; width:36%; text-align:center; }

<body>
  <main>
    <header>
      <div class="clock" id="clock">—</div>
      <div class="day-info"><div class="date" id="date">—</div></div>
      <div class="brand"><img src="folkhalsan-logo-white.png?v=12" alt="Folkhälsan"></div>
    </header>
    <section class="top">
      <article class="weather panel" aria-label="Väder">
        <img class="weather-art" src="weather-overcast.png" alt=""><div class="current-rain" aria-hidden="true"><i class="rain-drop drop-one"></i><i class="rain-drop drop-two"></i><i class="rain-drop drop-three"></i></div>
        <div class="weather-main"><h1>Vädret i Helsingfors</h1><div class="condition" id="condition">Hämtar väder…</div></div>
        <div class="reading"><div class="weather-icon" id="weather-icon" aria-hidden="true"></div><div class="temp" id="temp">—°</div></div>
        <div class="details"><div><span>Vind</span><b id="wind">—</b></div><div><span>Luftfuktighet</span><b id="humidity">—</b></div></div>
      </article>
      <section class="forecast panel" aria-label="Femdagarsprognos"><h2>5-dagarsprognos<small>Helsingfors</small></h2><div id="forecast-days"><div class="forecast-day">Hämtar…</div></div></section>
      <aside class="photo panel weather-partly"><img src="building.png" alt="Silviahemmet"><div class="photo-weather" aria-hidden="true"></div><div class="photo-title">Silviahemmet<span class="photo-heart">♡</span></div></aside>
    </section>
    <article class="news panel" aria-label="Nyheter och dagens citat"><div class="news-label"><span id="news-source">Yle</span><small id="news-section">Senaste nyheterna</small></div><div id="headlines"><div class="headline">Hämtar de senaste nyheterna…</div></div></article>
  </main>
  <script src="compat.js?v=26"></script>
  <script type="text/plain">
    const weatherCode = {0:'Klart',1:'Mestadels klart',2:'Halvklart',3:'Mulet',45:'Dimma',48:'Rimfrost-dimma',51:'Lätt duggregn',53:'Duggregn',55:'Kraftigt duggregn',61:'Lätt regn',63:'Regn',65:'Kraftigt regn',71:'Lätt snö',73:'Snöfall',75:'Kraftigt snöfall',80:'Regnskurar',81:'Regnskurar',82:'Kraftiga skurar',95:'Åska'};
    function showDate(){ const now=new Date(); document.getElementById('clock').textContent=new Intl.DateTimeFormat('sv-FI',{hour:'2-digit',minute:'2-digit',hour12:false}).format(now); document.getElementById('date').textContent=new Intl.DateTimeFormat('sv-FI',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now); }
    async function getNameDay(){
      const knownSwedishNameDays={'28.7':'Håkan'}, dateKey=(new Date()).getDate()+'.'+((new Date()).getMonth()+1);
      currentNameDay=knownSwedishNameDays[dateKey]||'–';
      const now=new Date(), url='https://www.nimipaivat.fi/'+now.getDate()+'.'+(now.getMonth()+1)+'.';
      const get=async address=>{const r=await fetch(address); if(!r.ok) throw new Error(); return r.text();};
      try { let html; try { html=await get(url); } catch { html=await get('https://api.allorigins.win/raw?url='+encodeURIComponent(url)); } const text=new DOMParser().parseFromString(html,'text/html').body.textContent.replace(/\s+/g,' '); const match=text.match(/Ruotsinkieliset namn:\s*([^ ]+(?:,\s*[^ ]+)*)/i)||text.match(/Ruotsinkieliset nimet:\s*([^ ]+(?:,\s*[^ ]+)*)/i); if(match) currentNameDay=match[1]; } catch(e) { /* The local fallback remains visible. */ }
    }
    function setWeatherIcon(code) {
      document.querySelector('.weather').classList.toggle('has-illustration', code === 3);
      const sun='<circle class="sun" cx="50" cy="50" r="17"/><path class="sun" d="M50 10v10M50 80v10M10 50h10M80 50h10M22 22l7 7M71 71l7 7M78 22l-7 7M29 71l-7 7"/>';
      const cloud='<path class="cloud" d="M20 71c-9 0-14-6-14-14 0-9 7-16 16-16 3-13 13-21 27-21 15 0 27 11 28 26 10 0 17 6 17 15 0 7-6 12-14 12H20z"/>';
      let art = sun, type='sunny';
      if ([1,2].includes(code)) { art=sun+cloud; type='partly cloudy'; }
      else if (code===3) { art=cloud; type='cloudy'; }
      else if ([45,48].includes(code)) { art=cloud+'<path class="fog" d="M20 78h55M32 90h52"/>'; type='foggy'; }
      else if ([51,53,55,61,63,65,80,81,82].includes(code)) { art=cloud+'<path class="rain" d="M31 77l-5 12M52 77l-5 12M73 77l-5 12"/>'; type='rainy'; }
      else if ([71,73,75,77,85,86].includes(code)) { art=cloud+'<path class="snow" d="M30 83h12M36 77v12M32 79l8 8M40 79l-8 8M64 83h12M70 77v12M66 79l8 8M74 79l-8 8"/>'; type='snowy'; }
      else if ([95,96,99].includes(code)) { art=cloud+'<path class="bolt" d="M53 69 40 90h12l-4 15 17-26H53z"/>'; type='thunderstorm'; }
      document.getElementById('weather-icon').innerHTML='<svg viewBox="0 0 100 110" role="img" aria-label="'+type+'">'+art+'</svg>';
    }
    function forecastIcon(code){ if(code===0) return 'forecast-sun.png'; if([1,2].includes(code)) return 'forecast-partly.png'; if([51,53,55,61,63,65,71,73,75,77,80,81,82,85,86,95,96,99].includes(code)) return 'forecast-cloud.png'; return 'forecast-cloud.png'; }
    async function forecast(){ try { const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.1699&longitude=24.9384&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FHelsinki&forecast_days=5'); const d=await r.json(), daily=d.daily; document.getElementById('forecast-days').innerHTML=daily.time.map((day,i)=>{ const label=new Intl.DateTimeFormat('sv-FI',{weekday:'short'}).format(new Date(day+'T12:00:00')); return '<div class="forecast-day"><span class="weekday">'+label+'</span><span class="mini-icon"><img src="'+forecastIcon(daily.weather_code[i])+'" alt=""></span><span class="high">'+Math.round(daily.temperature_2m_max[i])+'°</span><span class="low">'+Math.round(daily.temperature_2m_min[i])+'°</span></div>'; }).join(''); } catch(e) { document.getElementById('forecast-days').innerHTML='<div class="forecast-day">Prognosen kunde inte hämtas.</div>'; } }
    async function weather(){ const $=id=>document.getElementById(id); try { const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=60.1699&longitude=24.9384&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=Europe%2FHelsinki'); const d=await r.json(), c=d.current; $('temp').textContent=Math.round(c.temperature_2m)+'°'; $('condition').textContent=weatherCode[c.weather_code]||'Aktuellt väder'; setWeatherIcon(c.weather_code); $('wind').textContent=Math.round(c.wind_speed_10m)+' m/s'; $('humidity').textContent=c.relative_humidity_2m+' %'; } catch(e){ $('condition').textContent='Väderuppgifterna är tillfälligt otillgängliga'; } }
    const dailyQuotes=['Varje ny dag är en ny möjlighet att hitta något vackert.','Ett vänligt ord kan göra en vanlig dag lite ljusare.','Glädje blir större när den delas med någon annan.','Små steg framåt är också framsteg.','Ett leende är ett språk som alla förstår.','Det är de små stunderna som gör en dag minnesvärd.','Hopp är en liten låga som kan lysa långt.'];
    let newsItems=[], newsIndex=0, currentNameDay='–';
    function showNextNews(){
      const box=document.getElementById('headlines'), source=document.getElementById('news-source'), section=document.getElementById('news-section'), panel=document.querySelector('.news');
      if(!newsItems.length) return;
      if(newsIndex===newsItems.length){ const quote=dailyQuotes[Math.floor(Date.now()/86400000)%dailyQuotes.length]; panel.classList.remove('nameday-slide'); panel.classList.add('quote-slide'); source.textContent='Dagens citat'; section.textContent='En liten tanke för dagen'; box.innerHTML='<div class="headline quote">“'+quote+'”</div>'; newsIndex++; return; }
      if(newsIndex===newsItems.length+1){ panel.classList.add('quote-slide','nameday-slide'); source.textContent='Dagens namnsdag'; section.textContent='I dag firar vi'; box.innerHTML='<div class="headline">'+currentNameDay+'</div>'; newsIndex=0; return; }
      const item=newsItems[newsIndex]; panel.classList.remove('quote-slide','nameday-slide'); source.textContent='Yle'; section.textContent='Senaste nyheterna'; box.innerHTML='<div class="headline"><a href="'+item.link+'" target="_blank" rel="noopener">'+item.title+'</a></div>'; newsIndex++;
    }
    async function news(){
      const box=document.getElementById('headlines');
      const feed='https://svenska.yle.fi/rss/senaste-nytt';
      const getFeed=async url=>{ const r=await fetch(url); if(!r.ok) throw new Error('Feed unavailable'); return r.text(); };
      const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      try {
        let content;
        try { content=await getFeed(feed); }
        catch { content=await getFeed('https://api.allorigins.win/raw?url='+encodeURIComponent(feed)); }
        const xml=new DOMParser().parseFromString(content,'text/xml');
        const items=[...xml.querySelectorAll('item')].slice(0,3);
        if(!items.length || xml.querySelector('parsererror')) throw new Error('Invalid feed');
        newsItems=items.map(x=>({ title:escape(x.querySelector('title')?.textContent||''), link:escape(x.querySelector('link')?.textContent||'https://svenska.yle.fi') }));
        newsIndex=0; showNextNews();
      } catch(e) { box.innerHTML='<div class="headline">Yle-nyheterna kunde inte hämtas just nu.</div>'; }
    }
    showDate(); getNameDay(); weather(); forecast(); news(); setInterval(showDate,30000); setInterval(weather,10*60*1000); setInterval(forecast,30*60*1000); setInterval(news,10*60*1000); setInterval(showNextNews,15000); setInterval(getNameDay,6*60*60*1000); setInterval(()=>window.location.reload(),60*60*1000);
  </script>
</body>
